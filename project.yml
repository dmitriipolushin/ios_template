# XcodeGen Project Configuration
#
# Setup:
#   brew install xcodegen
#   xcodegen generate
#
# .xcodeproj is gitignored — regenerate after clone.

name: AppName # <-- REPLACE

options:
  bundleIdPrefix: com.example # <-- REPLACE
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1" # 1 = iPhone, "1,2" = iPhone + iPad
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-Owholemodule"
      SWIFT_COMPILATION_MODE: wholemodule

    # -- Uncomment permissions as needed --
    # INFOPLIST_KEY_NSCameraUsageDescription: "Camera access for scanning"
    # INFOPLIST_KEY_NSMicrophoneUsageDescription: "Microphone access for voice input"
    # INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech recognition for voice input"
    # INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Photo library access"
    # INFOPLIST_KEY_NSHealthShareUsageDescription: "Read health data"
    # INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Write health data"
    # INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Location for recommendations"
    # INFOPLIST_KEY_NSUserTrackingUsageDescription: "Used to deliver personalized ads"

packages:
  Adapty:
    url: https://github.com/adaptyteam/AdaptySDK-iOS
    from: "3.15.6"

  # -- Uncomment as needed --
  # Firebase:
  #   url: https://github.com/firebase/firebase-ios-sdk
  #   from: "11.0.0"
  # Supabase:
  #   url: https://github.com/supabase/supabase-swift
  #   from: "2.0.0"

targets:
  AppName: # <-- REPLACE (must match `name:`)
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "**/.DS_Store"
          - "**/Secrets.plist"
    resources:
      - path: App/Resources
        optional: true
    dependencies:
      - package: Adapty
        product: Adapty
      # - package: Firebase
      #   product: FirebaseAnalytics
      # - package: Supabase
      #   product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.appname # <-- REPLACE
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "App Name" # <-- REPLACE
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    # -- Uncomment both the scheme AND target to add tests --
    # scheme:
    #   testTargets:
    #     - AppNameTests # <-- REPLACE

  # AppNameTests: # <-- REPLACE
  #   type: bundle.unit-test
  #   platform: iOS
  #   sources:
  #     - Tests
  #   dependencies:
  #     - target: AppName
